<!doctype html>
<html><head><meta charset="utf-8"><style>
  :root { --fg-color:#ddd; --border-color:#444; --comfy-input-bg:#222; --comfy-menu-bg:#1c1c1c; --p-primary-color:#2d6cdf; }
  html,body { margin:0; height:100%; background:#0e0e0e; font-family: system-ui, sans-serif; }
  /* Mimics ComfyUI's sidebar tab host: fixed width, full height, clipped. */
  #sidebar { position:absolute; top:0; left:0; width:480px; height:100vh; overflow:hidden;
             background:#181818; border-right:1px solid #333; }
</style></head>
<body>
  <div id="sidebar"></div>
  <script type="module">
    import "./extensions/wmd/panel.js";
    const params = new URLSearchParams(location.search);
    window.__itemCount = params.get("items") ?? 14;
    window.__jobCount = params.get("jobs") ?? 0;
    // Mount the tab the extension registered, as ComfyUI would.
    window.__tab.render(document.getElementById("sidebar"));
    window.__ready = true;
  </script>
</body></html>
