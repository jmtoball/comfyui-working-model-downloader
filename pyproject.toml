[project]
name = "working-model-downloader"
description = "Download HuggingFace and Civitai models into the right ComfyUI folder, driven by the links workflow authors document in their notes."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests"]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/jmtoball/comfyui-working-model-downloader"

[tool.comfy]
PublisherId = "jmtoball"
DisplayName = "Working Model Downloader"
Icon = ""

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
